; Venexpress (contenedor de producción)
expose_php = Off
memory_limit = 256M
max_execution_time = 60
upload_max_filesize = 20M
post_max_size = 24M
date.timezone = UTC

; El código no cambia dentro del contenedor: no revisar archivos en cada request.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 64
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
