; Config de Supervisor para mantener corriendo el worker de colas de
; Venexpress (procesa las notificaciones en cola, ej. PackageStatusUpdated,
; y la geocodificación de direcciones de entrega, cola "geocoding").
;
; SIN ESTO, aunque configures un MAIL_MAILER real, los correos se
; quedan encolados en la tabla `jobs` y nunca se envían — y los
; paquetes reclamados por un repartidor de entrega nunca obtienen
; delivery_latitude/longitude, así que "Mi Ruta de Entrega" nunca
; puede ordenarlos por distancia (quedan atascados en "pendiente de
; ubicar" para siempre).
;
; --- Instalación en el servidor (Ubuntu/Debian con Supervisor) ---
; 1. sudo apt install supervisor          (si no lo tienes)
; 2. Copia este archivo a:
;    sudo cp deploy/supervisor-venexpress-worker.conf /etc/supervisor/conf.d/venexpress-worker.conf
; 3. Edita las rutas de abajo (directory, command, stdout_logfile) para
;    que apunten a la ruta real de tu proyecto en el servidor.
; 4. sudo supervisorctl reread
; 5. sudo supervisorctl update
; 6. sudo supervisorctl start venexpress-worker:*
;
; --- Verificar que está corriendo ---
;    sudo supervisorctl status venexpress-worker:*
;
; --- Tras cada deploy con cambios de código ---
; Los workers cachean el código en memoria; reinícialos siempre:
;    php artisan queue:restart

[program:venexpress-worker]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/venexpress
command=php artisan queue:work database --queue=default,geocoding --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/venexpress/storage/logs/worker.log
stopwaitsecs=3600
